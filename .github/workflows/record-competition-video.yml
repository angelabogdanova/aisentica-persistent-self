# Revision 5: exact synchronization of evidence, architecture and final scenes.
name: Record Competition Video

on:
  push:
    paths:
      - .github/workflows/record-competition-video.yml
      - scripts/record-demo.mjs
      - scripts/prepare-voiceover.py
      - scripts/assemble-competition-video.py
      - video/voiceover-clips.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persistent-self-video-production
  cancel-in-progress: false

env:
  APP_URL: https://d31np75gupnbhy.cloudfront.net

jobs:
  record-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project and video dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Verify application code before recording
        run: npm run check

      - name: Record the live production judge flow
        env:
          VIDEO_OUTPUT_DIR: video-output
        run: node scripts/record-demo.mjs

      - name: Prepare high-quality segmented English voiceover
        run: python3 scripts/prepare-voiceover.py

      - name: Assemble and validate the scene-synchronized competition video
        run: python3 scripts/assemble-competition-video.py

      - name: Prepare publishable deliverables
        shell: bash
        run: |
          set -euo pipefail
          rm -rf video/generated
          mkdir -p video/generated/screenshots

          cp video-output/aisentica-persistent-self-demo.mp4 \
            video/generated/aisentica-persistent-self-demo.mp4
          cp video-output/subtitles.srt \
            video/generated/aisentica-persistent-self-demo.srt
          cp video-output/voiceover.mp3 video/generated/voiceover.mp3
          cp video-output/voiceover-report.json video/generated/voiceover-report.json
          cp video-output/screenshots/00-title.png video/generated/thumbnail.png
          cp video-output/screenshots/11-architecture.png video/generated/architecture.png
          cp video-output/screenshots/*.png video/generated/screenshots/
          cp video-output/recording-report.json video/generated/recording-report.json
          cp video-output/final-validation.json video/generated/final-validation.json
          cp video-output/final-ffprobe.txt video/generated/final-ffprobe.txt
          cp video-output/downloads/persistent-self-manifest.json \
            video/generated/recorded-manifest.json

          cat > video/generated/README.md <<'EOF'
          # Generated Competition Video

          This directory was produced automatically from the live CloudFront application.

          - `aisentica-persistent-self-demo.mp4` — final 1080p competition video;
          - `aisentica-persistent-self-demo.srt` — English subtitles;
          - `voiceover.mp3` — final segmented AI Voice Generator narration;
          - `voiceover-report.json` — voice sources, timings and part durations;
          - `thumbnail.png` — publication thumbnail;
          - `architecture.png` — final technical architecture image;
          - `screenshots/` — definitive product and evidence screenshot set;
          - `recording-report.json` — live recording identity and scenario record;
          - `final-validation.json` — duration, resolution, codecs and synchronization report;
          - `recorded-manifest.json` — manifest exported during the recorded production flow.
          EOF

      - name: Upload complete production artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisentica-persistent-self-competition-video
          path: |
            video/generated/
            video-output/raw/
          retention-days: 30
          if-no-files-found: error

      - name: Commit final video and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Angela Bogdanova'
          git config user.email 'angelabogdanova@users.noreply.github.com'
          git add video/generated

          if git diff --cached --quiet; then
            echo 'Generated deliverables are unchanged.'
            exit 0
          fi

          git commit -m 'video: generate final synchronized competition demonstration'
          git pull --rebase origin main
          git push origin HEAD:main

AWSTemplateFormatVersion: '2010-09-09'
Description: Secure GitHub Actions OIDC deployment role for Aisentica Persistent Self.

Parameters:
  GitHubOwner:
    Type: String
    Default: angelabogdanova
  GitHubOwnerId:
    Type: String
    Default: '195788985'
  GitHubRepository:
    Type: String
    Default: aisentica-persistent-self
  GitHubRepositoryId:
    Type: String
    Default: '1310104569'
  GitHubBranch:
    Type: String
    Default: main
  ApplicationStackName:
    Type: String
    Default: aisentica-persistent-self

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: Aisentica Persistent Self

  RuntimePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: aisentica-persistent-self-runtime-boundary
      Description: Maximum permissions available to Aisentica Persistent Self Lambda execution roles.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ProjectLambdaLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationStackName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationStackName}-*:*'
          - Sid: ProjectXRayTelemetry
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:GetSamplingStatisticSummaries
            Resource: '*'
          - Sid: ProjectExportWrites
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationStackName}-*/*'
          - Sid: ProjectBedrockInference
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: '*'

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aisentica-persistent-self-github-deploy
      Description: Temporary GitHub Actions deployment access for the Aisentica Persistent Self main branch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: DeployPersistentSelfInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageApplicationCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationStackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - Sid: UseServerlessTransformForChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: ReadBootstrapAndValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: ManageProjectAndSamArtifacts
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationStackName}-*/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*/*'
              - Sid: ListBucketsForSam
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Sid: ManageProjectLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApplicationStackName}-*'
              - Sid: ListLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
              - Sid: ManageHttpApi
                Effect: Allow
                Action:
                  - apigateway:*
                Resource: '*'
              - Sid: ManageProjectCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetInvalidation
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:ListDistributions
                  - cloudfront:ListInvalidations
                  - cloudfront:ListOriginAccessControls
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateOriginAccessControl
                Resource: '*'
              - Sid: CreateBoundedProjectRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref RuntimePermissionsBoundary
              - Sid: ManageBoundedProjectRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-*'
              - Sid: AttachApprovedLambdaPolicies
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
                      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSXrayWriteOnlyAccess'
              - Sid: PassOnlyProjectRolesToLambda
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: ARN stored in the GitHub Actions secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
  RuntimePermissionsBoundaryArn:
    Description: Permissions boundary applied to generated Lambda execution roles.
    Value: !Ref RuntimePermissionsBoundary
